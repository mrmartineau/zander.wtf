name: Deploy to Cloudflare

env:
  SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
  OTTER_API_KEY: ${{ secrets.OTTER_API_KEY }}
  LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
  SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
  ZM_API: ${{ secrets.ZM_API }}
  SUPABASE_USER_API_KEY: ${{ secrets.SUPABASE_USER_API_KEY }}

on:
  schedule:
    - cron: '0 0/12 * * *' # every 12 hours
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_package_age:
        description: 'Bypass Aikido safe-chain minimum package age check'
        type: boolean
        default: false

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      # Pinned: 1.5.18 (2026-09-08) crashes with "unexpected end of file" while
      # verifying the lockfile, which then fails every package fetch.
      - name: Install safe-chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.17/install-safe-chain.sh | SAFE_CHAIN_VERSION=1.5.17 sh -s -- --ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile ${{ inputs.skip_package_age && '--safe-chain-skip-minimum-package-age' || '' }}
      - name: Build site
        run: pnpm build
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zander-wtf
      # Runs after deploy so new pages exist before they're searchable
      - name: Update search index (D1)
        run: pnpm search:push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
